# 자동 생성: generate_configs.sh — 직접 편집하지 말 것
# 로봇 #3 <-> 관제 평면 브릿지 (도메인 12 <-> 8)
name: pinky_bridge_robot3
from_domain: 12
to_domain: 8

topics:

  # ══ 업링크: 로봇(12) → 관제(8) ══════════════════════════════

  robot3/odom:
    type: nav_msgs/msg/Odometry
    qos: {reliability: reliable, durability: volatile, history: keep_last, depth: 10}

  robot3/pose:
    type: geometry_msgs/msg/PoseStamped
    qos: {reliability: reliable, durability: volatile, history: keep_last, depth: 10}

  # 로봇 안에서는 표준 이름 /scan 을 유지하고(온보드 SLAM·Nav2 호환),
  # 관제 도메인에 합류할 때만 로봇별 이름으로 분리한다.
  scan:
    type: sensor_msgs/msg/LaserScan
    remap: robot3/scan
    qos: {reliability: best_effort, durability: volatile, history: keep_last, depth: 5}

  # 원본(image_raw)은 절대 중계하지 않는다. 2.4GHz 채널 11에서 4대분 원본을
  # 8·9 두 도메인으로 복제하면 AP가 즉시 포화된다. 압축본만 통과시킨다.
  robot3/camera/image_raw/compressed:
    type: sensor_msgs/msg/CompressedImage
    qos: {reliability: best_effort, durability: volatile, history: keep_last, depth: 2}

  robot3/nav_status:
    type: std_msgs/msg/String
    qos: {reliability: reliable, durability: volatile, history: keep_last, depth: 10}

  robot3/battery_state:
    type: sensor_msgs/msg/BatteryState
    qos: {reliability: reliable, durability: volatile, history: keep_last, depth: 5}

  # frame_prefix 로 robot3/ 접두사가 붙어 있어야 4대 병합 시 충돌하지 않는다.
  tf:
    type: tf2_msgs/msg/TFMessage
    qos: {reliability: reliable, durability: volatile, history: keep_last, depth: 100}

  tf_static:
    type: tf2_msgs/msg/TFMessage
    qos: {reliability: reliable, durability: transient_local, history: keep_last, depth: 100}

  # ══ 다운링크: 관제(8) → 로봇(12) — 화이트리스트 ═══════════════
  # 관제국은 로봇별로 구분된 이름으로 발행하고, 브릿지가 해당 로봇 도메인
  # 안에서만 표준 이름으로 되돌린다. 이렇게 해야 하나의 목표 지점이 4대
  # 전부에게 동시에 전달되는 사고가 발생하지 않는다.

  robot3/goal_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 8
    to_domain: 12
    remap: goal_pose
    qos: {reliability: reliable, durability: volatile, history: keep_last, depth: 1}

  robot3/mission_cmd:
    type: std_msgs/msg/String
    from_domain: 8
    to_domain: 12
    qos: {reliability: reliable, durability: volatile, history: keep_last, depth: 10}

  robot3/cmd_vel:
    type: geometry_msgs/msg/Twist
    from_domain: 8
    to_domain: 12
    remap: cmd_vel
    qos: {reliability: reliable, durability: volatile, history: keep_last, depth: 10}

  # 🔴 2026-09-19 신설 — 사용자 결정 "로봇까지".
  #
  # 연산 노드(태블릿)가 영상에서 뽑은 좌표를 게이트웨이가 POST /api/vision/pose 로 받아
  # 도메인 8 에 발행한다. 이 줄이 없으면 그 좌표는 **관제 도메인에서 멈춘다**
  # — 2026-09-19 이전이 그 상태였고, 발행자만 있고 구독자·브리지 등재가 0이었다.
  #
  # ⭐ 이름을 vision_pose 로 둔다. 로봇이 **스스로 믿는** 값(amcl_pose)과 밖에서
  #    **관측한** 값을 같은 이름에 담으면, 둘이 어긋날 때 어느 쪽을 고쳐야 하는지
  #    이름이 말해 주지 못한다.
  #
  # ⚠️ QoS 를 reliable 로 둔 이유 (best_effort 가 아니다):
  #    게이트웨이는 create_publisher(PoseStamped, ..., 10) 즉 **reliable** 로 낸다.
  #    브리지가 best_effort 로 내보내면 로봇 쪽 reliable 구독자와 **안 맞는다**
  #    (제공 best_effort < 요구 reliable). reliable 로 내면 양쪽 구독자가 다 붙는다.
  #    대신 depth: 1 로 큐를 막는다 — 낡은 좌표를 재전송하는 것은 없느니만 못하다
  #    (신선도 문턱 500 ms 는 gateway_web/vision_ingest.py 가 강제한다).
  robot3/vision_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 8
    to_domain: 12
    remap: vision_pose
    qos: {reliability: reliable, durability: volatile, history: keep_last, depth: 1}

  # 감싼 서비스 'led' — 로봇 위 topic_wrap.py 가 서비스를 이 토픽 쌍으로 바꿔 준다.
  # 이름 규칙의 주인은 topic_wrap.py 의 topic_names() 다.
  robot3/svc/led/request:
    type: std_msgs/msg/String
    from_domain: 8
    to_domain: 12
    qos: {reliability: reliable, durability: volatile, history: keep_last, depth: 10}

  robot3/svc/led/result:
    type: std_msgs/msg/String
    qos: {reliability: reliable, durability: volatile, history: keep_last, depth: 10}
