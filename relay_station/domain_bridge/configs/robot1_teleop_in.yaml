# 자동 생성: generate_configs.sh — 직접 편집하지 말 것
# 벌 2-A · 팀원(9) → 관제(8)  [주행 명령을 관제국에 보인다]
#
# 여기까지는 로봇에 닿지 않는다. 내보내는 것은 robot1_teleop_out.yaml 이다.
name: pinky_teleop_in_robot1
from_domain: 9
to_domain: 8

topics:

  # 팀원 조종기 전용 이름. 팀원이 시뮬에 쓰는 robot1/cmd_vel 과 **다른 이름**이라
  # 시뮬 트래픽은 여기에 걸리지 않는다.
  robot1/teleop/cmd_vel:
    type: geometry_msgs/msg/Twist
    qos: {reliability: reliable, durability: volatile, history: keep_last, depth: 10}

  # 누가 몰고 있는지. 조종기가 자기 이름을 함께 낸다 — 화면이 "누구의 명령인가" 를
  # 말할 수 있어야 강사가 감독할 수 있다.
  robot1/teleop/operator:
    type: std_msgs/msg/String
    qos: {reliability: reliable, durability: transient_local, history: keep_last, depth: 1}
