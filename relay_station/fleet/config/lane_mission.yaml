# 차선 주행 미션 설정 (Relay Fleet Coordinator)
# 2.34m x 1.26m 경기장 기반: 서로 다른 출발점(START_A, START_B) -> 공통 도착점(GOAL_C)
# [FIELD CONFIG PENDING]: 현장 실측 전 임시 구성

graph: road_graph.yaml

reservation:
  reserve_ahead: 0.40             # 다음 엣지 시작 이 거리 안에서 예약 요청 (m)
  release_behind: 0.25            # 노드/엣지 끝을 이만큼 지나면 해제 (m)
  node_stop_margin: 0.20          # 분기점/교차로 앞 정지 여유 마진 (m)

coordinator:
  tick_rate: 10.0                 # 10Hz 예약 루프 및 LaneCommand 발행 주기
  state_timeout: 2.0              # RobotState 수신 타임아웃 (초)
  start_retry_max: 5              # START 명령 최대 재시도 횟수
  start_retry_interval: 1.0       # START 명령 재시도 간격 (초)
  goal_event_timeout: 3.0         # Goal zone 비전 이벤트 유효 시간 (초)
  auto_start: false

defaults:
  max_linear_vel: 0.15
  max_angular_vel: 1.2

# 로봇별 출발/도착 미션 지정 (Single Source of Truth)
# drive_mode (D6, 2026-09-24): nav2 = 온보드 PinkyAgent 가 Route 를 Nav2 목표 연쇄로 달린다
#   (가상 팜·실물 모두). lane = 팀11 lane_agent(차선 카메라). 기본값은 lane — 적지 않으면 예전과 같다.
robots:
  - name: pinky1
    drive_mode: nav2
    domain_id: 10
    start: START_A
    goal: GOAL_C
    depart_delay: 0.0
    color: "#ff5a7a"
  - name: pinky2
    drive_mode: nav2
    domain_id: 11
    start: START_B
    goal: GOAL_C
    depart_delay: 2.0
    color: "#38bdf8"
