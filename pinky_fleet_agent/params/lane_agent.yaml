# lane_agent_node 파라미터. launch 의 <param from=...> 로 통째로 넘긴다.
# 키 이름 = lane_driver.DriverParams / ControlParams / FsmParams / GuardParams 필드.
pinky_lane_agent:
  ros__parameters:
    control_rate: 20.0
    status_rate: 10.0
    pose_timeout: 1.0
    use_ultrasonic: true
    us_topic: us_sensor/range
    # DriverParams
    lookahead: 0.25
    arrive_tolerance: 0.10
    clearance_tolerance: 0.05
    link_timeout: 3.0            # LaneCommand(CLEARANCE 10 Hz) 침묵 허용
    path_timeout: 0.9            # LanePath 침묵 허용 (0.3 s × 3)
    path_max_age: 0.9
    crosswalk_zone: 0.45
    junction_zone: 0.25
    red_line_zone: 0.60         # 빨간 선(카메라) 트리거는 경로상 다음 분기 노드가 이 거리 안일 때만
    junction_wait_clearance: true # JUNCTION_STOP 에서 관제 허가(clear_until 이 분기 노드를 넘음) 를 기다린다
    lane_only: false             # true: 경로·위치 없이 카메라 차선 중앙만 (lane_only.launch.xml 이 덮는다)
    lane_lost_coast: 0.6
    search_omega: 0.4            # LANE_SEARCH 제자리 회전 각속도 (rad/s)
    odom_timeout: 0.5            # 비전 미션 교차로 동작: odom 이 이만큼 끊기면 멈춰 기다린다
    stop_line_min_gap: 0.15      # 비전 미션: 흰 정지선을 연달아 셀 때 최소 주행거리 (m)
    auto_start: false
    control:
      v_max: 0.15
      omega_max: 1.2
      kp: 1.2
      kd: 0.15
      k_err: 0.5
      k_curv: 0.5
      a_decel: 0.6
      stop_tolerance: 0.03
      accel_slew: 0.4
      cam_sign: 1.0              # 실차에서 확정: 로봇을 차선 왼쪽에 두면 우회전(ω<0) 이어야 한다. 아니면 -1.0
      v_min_moving: 0.04
      stale_max_age: 0.9
      single_weight: 0.8           # 차선 하나일 때 카메라 보정 가중치 (BOTH 1.0). 경로 없이 카메라로만 달릴 때 조향이 약하지 않게
    fsm:
      crosswalk_stop_seconds: 3.0
      crosswalk_relatch_distance: 0.60   # > crosswalk_zone
      lane_lost_speed_factor: 0.5
      blind_warn_distance: 0.60
      lane_search: true                  # 차선 쌍이 안 보이면 제자리 회전 탐색 (D14 작업 2)
      search_on_single: false            # 한쪽만 보이면 회전하지 않고 보이는 선에서 6 cm 안쪽을 따라간다 (아예 안 보일 때만 탐색)
      search_after: 0.5                  # 쌍이 이만큼(s) 안 보여야 탐색 시작
      search_confirm_seconds: 0.3        # 탐색 중 쌍이 이만큼 이어지면 주행 복귀
      search_max_seconds: 8.0            # 초과하면 실패 → 정지 (사람이 개입)
      junction_stop: true                # 분기 노드 반경(junction_zone) 진입 시 정지 후 경로만으로 통과 (D14 작업 3)
      junction_stop_seconds: 1.0
      junction_speed_factor: 0.4         # 통과 속도 = v_max × 0.4 (0.15 → 0.06)
      junction_exit_confirm: 0.3         # 반경 밖에서 차선 쌍이 이만큼 보이면 주행 복귀
      junction_relatch_distance: 0.60    # > 2 × junction_zone
    guard:
      sector_deg: 35.0
      box_x: 0.18
      box_y: 0.10
      us_stop: 0.10              # 초음파(앞면) 10 cm 이하면 정지 (2026-09-30 결정)
      us_min_valid: 0.03
      confirm_count: 2
      clear_seconds: 1.0
      lidar_offset_x: 0.0
    maneuver:                    # 비전 미션 교차로 고정 동작 (maneuver.ManeuverParams). 속도는 관제 JunctionPlan 이 주면 그 값
      linear_speed: 0.08
      angular_speed: 0.5
      min_linear: 0.03
      min_angular: 0.15
      slow_distance: 0.05
      slow_angle_deg: 20.0
      dist_tolerance: 0.005
      yaw_tolerance_deg: 1.5
      heading_kp: 1.5
