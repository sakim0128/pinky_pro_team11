/local_costmap/local_costmap:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    always_send_full_costmap: true
    autostart_node: false
    bond_heartbeat_period: 0.1
    filters: []
    footprint: '[[0.06, 0.06], [0.06, -0.06], [-0.06, -0.06], [-0.06, 0.06]]'
    footprint_padding: 0.009999999776482582
    global_frame: odom
    height: 3
    inflation_layer:
      cost_scaling_factor: 0.05
      enabled: true
      inflate_around_unknown: false
      inflate_unknown: false
      inflation_radius: 0.05
      plugin: nav2_costmap_2d::InflationLayer
    initial_transform_timeout: 60.0
    lethal_cost_threshold: 100
    map_topic: /map
    map_vis_z: 0.0
    observation_sources: ''
    origin_x: 0.0
    origin_y: 0.0
    plugins:
    - voxel_layer
    - inflation_layer
    publish_frequency: 2.0
    resolution: 0.05
    robot_base_frame: base_footprint
    robot_radius: 0.1
    rolling_window: true
    start_type_description_service: true
    track_unknown_space: false
    transform_tolerance: 0.3
    trinary_costmap: true
    unknown_cost_value: 255
    update_frequency: 5.0
    use_maximum: false
    use_sim_time: false
    voxel_layer:
      combination_method: 1
      enabled: true
      footprint_clearing_enabled: true
      mark_threshold: 0
      max_obstacle_height: 0.2
      min_obstacle_height: 0.0
      observation_sources: scan
      origin_z: 0.0
      plugin: nav2_costmap_2d::VoxelLayer
      publish_voxel_map: true
      scan:
        clearing: true
        data_type: LaserScan
        expected_update_rate: 0.0
        inf_is_valid: false
        marking: true
        max_obstacle_height: 0.2
        min_obstacle_height: 0.0
        observation_persistence: 0.0
        obstacle_max_range: 1.5
        obstacle_min_range: 0.0
        raytrace_max_range: 2.5
        raytrace_min_range: 0.0
        sensor_frame: ''
        topic: /scan
      unknown_threshold: 15
      z_resolution: 0.05
      z_voxels: 16
    width: 3

