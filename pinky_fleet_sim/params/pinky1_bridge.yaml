# pinky1 용 ros_gz_bridge 설정 (자동 생성: make_sim_bridge.py).
#
# ros_topic_name / gz_topic_name 을 둘 다 **절대 경로**로 적는다. 브리지 노드를
# 네임스페이스 안에서 돌리면 gz 쪽 이름에도 네임스페이스가 붙는지가 버전을 타서,
# 아예 양쪽을 못박아 두고 브리지는 네임스페이스 밖에서 띄운다.
#
# gz 토픽 이름은 pinky_gz.urdf.xacro 가 ${namespace}scan 처럼 만든 것이다.
# 실제 이름이 다르면 `gz topic -l` 로 확인하고 여기를 고친다.

- ros_topic_name: "/pinky1/scan"
  gz_topic_name: "/pinky1/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/pinky1/odom"
  gz_topic_name: "/pinky1/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/pinky1/joint_states"
  gz_topic_name: "/pinky1/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/pinky1/cmd_vel"
  gz_topic_name: "/pinky1/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# DiffDrive 플러그인은 tf_topic 이 `/tf` 로 **고정**이라 두 로봇이 같은 gz 토픽에
# 쓴다. 프레임 이름에는 네임스페이스가 붙어 있어서(pinky1/odom -> pinky1/base_footprint)
# 섞여도 충돌하지 않는다. 각 네임스페이스의 Nav2 는 /pinky1/tf 를 듣기 때문에
# 여기서 같은 gz /tf 를 각 네임스페이스로 복사해 준다.
- ros_topic_name: "/pinky1/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
