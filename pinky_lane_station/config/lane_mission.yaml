# 로봇 목록 (mini_project_2). lane_pipeline_node · fake_lane_robot 가 공유한다 — 로봇마다 토픽·속도 상한을 만든다.
# start / goal 은 road_graph.yaml 의 노드 id 이고 **기본값일 뿐이다**: 경로 배정·구간 예약·출발은 중계 코디네이터
# (relay_station/fleet/fleet_coordinator.py, 미션 파일 relay_station/fleet/config/profiles/team11_map5/lane_mission.yaml)가
# 하고, 시작·목적지는 중계 웹의 /api/fleet/assign(V2 "미션 배정" 카드)에서 고른다. fake_lane_robot 는 start 노드에서 시작한다.

graph: road_graph.yaml            # 이 파일 기준 상대경로 (비우면 패키지 기본)

map:
  yaml_path: "$HOME/fleet_ws/src/pinky_pro_team11/pinky_fleet_station/config/map5.yaml"

defaults:
  max_linear_vel: 0.15
  max_angular_vel: 1.2

# 임시 미션(2026-09-29, map5 자리표시 도로망): pinky1 BL→TR, pinky2 BR→BL — relay 프로파일 team11_map5 와 같다
robots:
  - name: pinky1
    domain_id: 10
    start: BL
    goal: TR
    color: "#ff5a7a"
  - name: pinky2
    domain_id: 11
    start: BR
    goal: BL
    color: "#38bdf8"
