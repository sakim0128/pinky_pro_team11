# 2026-09-29 임시 좌표 — 새 맵 위에서 graph_editor 로 다시 찍는다
#
# map5 (pinky_fleet_station/config/map5.yaml: 236×128 셀, 0.01 m/셀, 원점 [-0.01, -0.01]) 좌표 — 지도는 x 0..2.36 m, y 0..1.28 m.
# 도로망 구현·파일은 이것 하나다: 중계 코디네이터(relay_station/fleet/config/profiles/team11_map5)도 이 파일을 그대로 읽는다.
# 엣지 waypoints 는 양 끝만 적는다 — 경로를 만들 때 road_graph.build_route 가 0.10 m 로 재샘플한다.
#
#   TR (2.15, 1.08) 오른쪽 상단
#      \
#       J (1.18, 0.64) 교차로
#      /   \
#   BL      BR
#  (0.20,0.20)  (2.15,0.20)
#
# 임시 미션: pinky1 BL→TR, pinky2 BR→BL (목표가 다르고, 어느 목표도 다른 로봇 경로 **안**에 있지 않다 — relay assign 규칙 L3)
frame: map
lane_width: 0.2
nodes:
- {id: BL, x: 0.2, y: 0.2, type: endpoint, label: 왼쪽 하단}
- {id: BR, x: 2.15, y: 0.2, type: endpoint, label: 오른쪽 하단}
- {id: TR, x: 2.15, y: 1.08, type: endpoint, label: 오른쪽 상단}
- {id: J, x: 1.18, y: 0.64, type: junction, label: 교차로}
edges:
- id: BL_J
  from: BL
  to: J
  oneway: false
  waypoints:
  - [0.2, 0.2]
  - [1.18, 0.64]
- id: J_TR
  from: J
  to: TR
  oneway: false
  waypoints:
  - [1.18, 0.64]
  - [2.15, 1.08]
- id: J_BR
  from: J
  to: BR
  oneway: false
  waypoints:
  - [1.18, 0.64]
  - [2.15, 0.2]
