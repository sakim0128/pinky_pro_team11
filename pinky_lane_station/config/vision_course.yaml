# 비전 미션 코스 좌표 (2026-09-30) — 관제 화면에 핑키 위치를 그리는 데만 쓴다(주행 제어에는 안 쓴다). vision_pose.py 가 읽는다.
#
# 좌표는 docs/map5.png (1003×625, map5 라이다 맵 위에 현장 차선·빨간 선·횡단보도를 그린 그림) 의 **px** 로 적는다.
# map 좌표(m)는 image: 절로 바꾼다 — map5.pgm(236×128 칸, 0.01 m) 의 칸 하나가 png 에서 약 4 px.
# 차선 중심선 점은 흰 선 두 개 사이 가운데를 그림에서 읽었다 (tools/vision_course_overlay.py 로 겹쳐 확인).
#
# 지점 (map5.png 로 볼 때): 1 = 오른쪽 아래 끝, 2 = 왼쪽 위 끝, 3 = 왼쪽 중간 끝.
# 교차로 = 빨간 선 3개: A(2 쪽) · B(1 쪽) · C(3 쪽). 횡단보도 1곳(3 번 가지).

image:
  file: docs/map5.png
  x0: 37.0                  # map5.pgm 칸 (0, 0) 의 왼쪽 위 모서리가 png 에서 (x0, y0)
  y0: 16.0
  px_per_cell_x: 4.0125
  px_per_cell_y: 4.023
map:
  yaml: pinky_fleet_station/config/map5.yaml
  resolution: 0.01
  origin: [-0.01, -0.01]
  height_cells: 128

# 정지 위치 → 로봇(구동축) 위치. 핑키는 선이 화면 0.80·H 행에 오면 선다 = 카메라 앞 약 0.144 m (lane_agent.yaml view:)
#   빨간 선: 구동축 ~ 선 가운데 = axle_to_camera 0.04 + 0.144 + 선 반폭 0.024 ≈ 0.21 m
#   횡단보도: 구동축 ~ 횡단보도 가까운 끝 = 0.04 + 0.144 ≈ 0.18 m
#   벽 마커 도착: 카메라 ~ 마커 arrive_distance(0.15) → 구동축 ~ 마커 = 0.15 + 0.04 = 0.19 m
red_stop_back: 0.21
crosswalk_stop_back: 0.18
marker_stop_back: 0.19

red_lines:                  # 선 가운데 (px)
  A: [405.5, 103.0]
  B: [628.5, 100.5]
  C: [495.7, 257.6]

