# 실전 인식 설정 — YOLO-seg. 모델 클래스: 0 왼쪽 라인, 1 횡단보도, 2 오른쪽 라인, 3 라바콘, 4 신호등, 5 바리게이트.
# 학습 때 이미지 상위 30 % 를 검정으로 채웠다 → pipeline.mask_top_frac 로 추론 입력도 똑같이 마스킹한다.
# 가중치는 git 에 넣지 않는다. 관제 PC 에 ~/models/lane_26n.pt 로 둔다.
# yolo26 은 ultralytics 8.4 이상:  pip install -U ultralytics
# 로드·속도 확인:  ros2 run pinky_lane_station bench_detector -- --config <이 파일> --synthetic
#   (관제 PC 는 CPU. p95 > 100 ms 면 imgsz 를 320 으로)
detector:
  kind: ultralytics
  model: "$HOME/models/lane_26n.pt"
  device: cpu
  imgsz: 448                      # 학습 입력 448×320 에 맞춤 (긴 변 448)
  conf: 0.35
  iou: 0.5
  # 우리 클래스 ← 모델 클래스 id. 좌/우 라벨은 차선이 3개 이상일 때 "가장 바깥 쌍" 을 고르는 데 쓴다
  # (≤ 2개면 화면 위치 규칙). barricade 는 정지 트리거, cone/traffic_light 는 오버레이 표시만.
  class_map: {left_lane: [0], right_lane: [2], crosswalk: [1], cone: [3], traffic_light: [4], barricade: [5]}

target:                           # lane_target.TargetParams
  sample_row_frac: 0.72
  half_lane_px_init: 180.0        # 640 px 기준. 첫 BOTH 관측 후 이력 중앙값으로 대체
  half_lane_px_min: 40.0
  half_lane_px_max: 300.0
  crosswalk_stop_row_frac: 0.80
  crosswalk_confirm: 3
  crosswalk_release: 5
  outer_pair_min_lanes: 3         # 차선 ≥ 3 → 클래스 기준 가장 바깥 쌍
  barricade_stop_row_frac: 0.80   # 바리게이트 하단이 이 행 아래로 오면 정지
  barricade_confirm: 3
  barricade_release: 10           # ≈ 1 s 안 보이면 재출발

pipeline:
  max_rate: 10.0
  stale_period: 0.3
  stale_max_seconds: 2.0
  warmup: true
  mask_top_frac: 0.30           # 추론 전 상위 30 % 행을 mask_fill 로 채움 (학습 조건과 동일). 0 이면 끔
  mask_fill: 0
  debug_polygons: false         # true 면 오버레이에 세그 폴리곤도 반투명으로 채움
