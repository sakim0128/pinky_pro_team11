# 실전 인식 설정 — YOLO-seg. 모델 클래스: 0 왼쪽 라인, 1 횡단보도, 2 오른쪽 라인, 3 라바콘, 4 신호등, 5 바리게이트.
# 교차로 빨간 테이프는 **모델 클래스가 아니다**(모델에 빨간 선 클래스 없음, 2026-09-30 확인) — 색(HSV) 검출(red_line_color: 절,
#   pinky_lane_station/red_line_detector.py)로 찾아 red_line 인스턴스로 넣는다. 판정(폭·하단 행·확정 프레임)은 target: 의 red_line_*.
# 목적지 흰 정지선은 모델이 아니라 영상 처리(stop_line: 절, pinky_lane_station/stop_line_detector.py)로 찾는다.
# 추론 입력의 상위 mask_top_frac 를 검정으로 채운다 (모델은 상위 30 % 마스킹으로 학습. 2026-09-30 부터 운용값 50 % — 먼 곳을 더 가린다).
# 가중치는 git 에 넣지 않는다. 관제 PC 에 ~/models/lane_26n.pt 로 둔다.
# yolo26 은 ultralytics 8.4 이상:  pip install -U ultralytics
# 로드·속도 확인:  ros2 run pinky_lane_station bench_detector -- --config <이 파일> --synthetic
#   (관제 PC 는 CPU. p95 > 100 ms 면 imgsz 를 320 으로)
detector:
  kind: ultralytics
  model: "$HOME/models/lane_26n.pt"
  device: cpu
  imgsz: 448                      # 학습 입력 448×320 에 맞춤 (긴 변 448)
  conf: 0.35
  iou: 0.5
  # 우리 클래스 ← 모델 클래스 id. 좌/우 라벨은 차선이 3개 이상일 때 "가장 바깥 쌍" 을 고르는 데 쓴다
  # (≤ 2개면 화면 위치 규칙). barricade 는 정지 트리거, cone/traffic_light 는 오버레이 표시만.
  # 빨간 선은 여기 넣지 않는다 — 모델에 없는 이름은 조용히 빠진다(시작 로그에 경고). 색 검출이 red_line 을 만든다.
  class_map: {left_lane: [0], right_lane: [2], crosswalk: [1], cone: [3], traffic_light: [4], barricade: [5]}

target:                           # lane_target.TargetParams
  sample_row_frac: 0.72
  half_lane_px_init: 180.0        # 640 px 기준. 첫 BOTH 관측 후 이력 중앙값으로 대체
  half_lane_px_min: 40.0
  half_lane_px_max: 300.0
  crosswalk_stop_row_frac: 0.80
  crosswalk_confirm: 3
  crosswalk_release: 5
  outer_pair_min_lanes: 3         # 차선 ≥ 3 → 클래스 기준 가장 바깥 쌍
  single_offset_ratio: 0.8        # 차선 하나: 보이는 선에서 반폭 × 0.8 안쪽 (도로 15 cm → 반폭 7.5 cm → 6 cm)
  single_use_class: true          # 차선 하나: 왼쪽/오른쪽은 모델 클래스로 (화면 위치는 클래스가 없을 때만)
  barricade_stop_row_frac: 0.80   # 바리게이트 하단이 이 행 아래로 오면 정지
  barricade_confirm: 3
  barricade_release: 10           # ≈ 1 s 안 보이면 재출발
  red_line_stop_row_frac: 0.80   # 빨간 테이프 하단이 이 행 아래로 오면 raw — 로봇이 테이프 바로 앞에 선다
  red_line_confirm: 2
  red_line_release: 5
  red_line_seek_min_width_frac: 0.10  # 로봇 교차로 seek 동작에 보내는 빨간 선 후보(LanePath.red_line_xs) 폭 하한 — 정지 판정(0.25)보다 느슨하게

red_line_color:                   # 교차로 빨간 테이프 — 색 검출 (red_line_detector.RedLineParams). 현장에서 lane_debug 의 보라 박스로 확인
  enabled: true
  roi_top_frac: 0.55              # 이 행 아래만 본다
  h_low_max: 10                   # 빨강 색상 0~10 과 170~179 (OpenCV H 0~179)
  h_high_min: 170
  s_min: 100                      # 채도 하한 — 테이프가 안 잡히면 낮추고(80), 카펫이 잡히면 올린다
  v_min: 60                       # 명도 하한 — 어두운 조명이면 낮춘다
  close_px: 9
  open_px: 3
  min_area_frac: 0.004            # ROI 면적 대비 덩어리 하한 — 작은 붉은 점 제외

stop_line:                        # 목적지 흰 정지선 — 영상 처리 (stop_line_detector.StopLineParams). 현장에서 lane_debug 로 보며 조정
  enabled: true
  roi_top_frac: 0.55              # 이 행 아래만 본다
  v_min: 180                      # 흰색 명도 하한 — 카펫(회색)이 잡히면 올린다
  s_max: 70                       # 흰색 채도 상한 — 빨간 테이프가 잡히면 내린다
  close_px: 15
  min_width_frac: 0.45            # 가로 흰 구간이 화면 폭의 이 비율 이상 (차선은 로봇 앞에서 세로·대각이라 좁다)
  min_rows: 4
  max_rows_frac: 0.20
  stop_row_frac: 0.80             # 하단이 이 행 아래로 오면 정지 — 더 가까이 서려면 올린다
  confirm: 2
  release: 3

aruco:                            # 도착 지점 벽 ArUco 마커 (aruco_detector.ArucoParams). 비전 미션 도착 판정 — 목적지 id 까지 거리
  enabled: true
  dictionary: DICT_4X4_50
  marker_size: 0.04               # 한 변 4 cm (검은 테두리 포함, 흰 여백 제외) — 현장 ANCHOR 마커 40 mm
  focal_px: 500.0                 # 640 px 폭 기준 초점거리. 현장에서 한 번: 마커를 정면 d m 에 두고 lane_debug 의 한 변 px 로
                                  #   focal_px = side_px × d / 0.04  (예: 0.30 m 에서 67 px → 502)
  ref_width: 640
  ids: [10, 11, 12]               # 1·2·3번 지점 벽 마커 — vision_mission.yaml arrival.markers 와 같게 (40~43 은 항공뷰 모서리)
  max_distance: 1.5
  confirm: 2
  release: 3

pipeline:
  max_rate: 10.0
  stale_period: 0.3
  stale_max_seconds: 2.0
  warmup: true
  mask_top_frac: 0.50           # 추론 전 상위 50 % 행을 mask_fill 로 채움 (학습은 30 % — 2026-09-30 운용 결정). 0 이면 끔
  mask_fill: 0
  debug_polygons: false         # true 면 오버레이에 세그 폴리곤도 반투명으로 채움
